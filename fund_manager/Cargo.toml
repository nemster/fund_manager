[package]
name = "fund_manager"
version = "1.0.0"
edition = "2021"

[dependencies]
scrypto = { version = "1.3.0" }
radix-common = { version = "1.3.0" }
radix-engine-interface = { version = "1.3.0" }
scrypto-interface = { path = "../scrypto-interface" }
dummy_validator = { path = "../validator", features = ["test"] }
dummy_dex_and_oracle = { path = "../dex_and_oracle", features = ["test"] }
dummy_defi_protocol = { path = "../defi_protocols/dummy", features = ["test"] }

[dev-dependencies]
scrypto-test = { version = "1.3.0" }

[features]
default = []
test = []

[lib]
crate-type = ["cdylib", "lib"]

[workspace]
